<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <title>Halo2 Verifier logo — dark variant</title>
  <desc>A dashed outer halo ring encircling a hexagon with a checkmark, in light blue tones for dark backgrounds</desc>

  <g transform="translate(200, 135)">

    <!-- rotating halo: dashed ring + orbit dots -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 4" opacity="0.5"/>
      <circle cx="72" cy="0" r="4" fill="#60a5fa"/>
      <circle cx="-72" cy="0" r="4" fill="#60a5fa" opacity="0.6"/>
      <circle cx="36" cy="-62" r="3" fill="#93c5fd"/>
      <circle cx="-36" cy="62" r="3" fill="#93c5fd"/>
    </g>

    <!-- static: inner ring, hexagon, checkmark -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.9"/>
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
    <polyline points="-14,2 -4,14 16,-12" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="20" letter-spacing="0.04em" fill="#e0f2fe">Halo2 Verifier</text>
  <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="0.12em" fill="#60a5fa">PLUTUS · CARDANO</text>
</svg>
