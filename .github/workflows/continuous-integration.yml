name: Continuous Integration

on:
  push:
    branches: ["main", "midnight-zk"]
  pull_request:
  workflow_dispatch:

jobs:
  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install wasm-pack v0.13.1
        run: |
          curl -L "https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz" \
            | tar xzf - --strip-components=1 -C ~/.cargo/bin \
              wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack
      - name: Build WASM
        run: wasm-pack build --target web --out-dir /tmp/wasm-fresh
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: /tmp/wasm-fresh/plutus_halo2_verifier_gen*

  deploy-pages:
    runs-on: ubuntu-latest
    needs: check-wasm
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/midnight-zk'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: docs/wasm/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4

  check-chip-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check docs/chip_profiles.json is up to date
        run: |
          cargo run --bin dump_profiles --release
          git diff --exit-code docs/chip_profiles.json \
            || { echo ""; echo "ERROR: docs/chip_profiles.json is stale."; \
                 echo "Re-run: cargo run --bin dump_profiles"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.19
      - run: cargo run --example equations_test --release
      - run: cargo run --example atms_with_lookups --release
      - run: cd aiken-verifier/aiken_halo2 && aiken build
      - run: cd aiken-verifier/aiken_halo2 && aiken check
      - run: cargo run --example schnorr --release
      - run: cd aiken-verifier/aiken_halo2 && aiken build
      - run: cd aiken-verifier/aiken_halo2 && aiken check
      - run: cargo run --example credential_properties --release
      - run: cd aiken-verifier/aiken_halo2 && aiken build
      - run: cd aiken-verifier/aiken_halo2 && aiken check
